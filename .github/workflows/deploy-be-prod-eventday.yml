name: Deploy Eventday Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache:
            maven

            # Mengganti hanya spring.mail.password
      - name: Update SMTP Password
        env:
          SPRING_MAIL_PASSWORD: ${{ secrets.SENDGRID_KEYS }}
        run: |
          python3 <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path("src/main/resources/application.properties")
          password = os.environ.get("SPRING_MAIL_PASSWORD", "")

          if not password or "\n" in password or "\r" in password:
              sys.exit("ERROR: SMTP secret kosong atau tidak valid.")

          content = path.read_text(encoding="utf-8")

          pattern = r"(?m)^spring\.mail\.password=.*$"
          updated, count = re.subn(
              pattern,
              lambda _: "spring.mail.password=" + password,
              content
          )

          if count != 1:
              sys.exit(
                  f"ERROR: Ditemukan {count} baris spring.mail.password; "
                  "harus tepat satu."
              )

          path.write_text(updated, encoding="utf-8")
          print("SMTP password property updated successfully.")
          PY

      - name: Build Executable JAR with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Copy JAR to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "target/*.jar"
          target: "/var/www/eventday-be/"
          strip_components: 1

      - name: Rename JAR & Restart Systemd Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu

            cd /var/www/eventday-be

            test -s eventday-0.0.1-SNAPSHOT.jar

            install -m 0755 \
            eventday-0.0.1-SNAPSHOT.jar \
            eventday-backend.jar.new

            mv -f eventday-backend.jar.new eventday-backend.jar

            sudo -n /usr/bin/systemctl restart eventday
            sudo -n /usr/bin/systemctl is-active eventday

            echo "Deployment completed successfully."
